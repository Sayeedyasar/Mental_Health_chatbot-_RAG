<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <h2>MH-ChatBot00</h2>
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">Hi! I’m here to listen and help. How are you feeling?</div>
        </div>
        <input type="text" id="userInput" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
        <div class="disclaimer">Note: I’m not a therapist, just here to offer support and resources.</div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            // Add user message to chat
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="message user-message">${message}</div>`;
            input.value = '';

            // Send to server and get response
            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                chatBox.innerHTML += `<div class="message bot-message">${data.response}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to bottom
            });
        }
    </script>
</body>
</html>
